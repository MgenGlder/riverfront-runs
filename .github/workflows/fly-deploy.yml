name: Deploy server to Fly.io

# Deploys the live-map WebSocket server to Fly whenever server-related files
# change on main. Frontend-only changes are handled by Netlify, so they don't
# trigger a Fly deploy.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    concurrency: deploy-fly # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
