# fly.toml app configuration file generated for riverfront-runs on 2026-07-23T12:13:06-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riverfront-runs'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://riverfrontruns.netlify.app,https://riverfrontruns2.netlify.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Scale to zero: Fly stops the machine when idle (unbilled) and starts it on
  # the next connection. ~2–5s cold start for the first runner; the client
  # auto-reconnects. Set back to 1 for an always-warm machine.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  # Tiny WebSocket server (~50–70 MB RSS); 256 MB is plenty and cheapest.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
